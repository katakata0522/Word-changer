<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="英字・カナ・空白の実用変換と、文字順の反転やランダム文字などのネタ変換をブラウザ内で行える無料ツールです。入力内容は外部へ送信しません。">
  <meta name="theme-color" content="#1f4e79">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="実用ネタ文字変換">
  <meta property="og:description" content="文章を入力し、実用変換やネタ変換をブラウザ内ですぐに試せます。">
  <title>実用ネタ文字変換｜Word-changer</title>
  <link rel="stylesheet" href="style.css">
  <script src="conversions.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">WORD-CHANGER</p>
    <h1>実用ネタ文字変換</h1>
    <p class="lead">変換方法を選び、文章を入力するだけ。処理はすべてこのブラウザ内で完結します。</p>
  </header>

  <main class="app-shell" aria-labelledby="converter-heading">
    <h2 id="converter-heading" class="visually-hidden">文字変換ツール</h2>

    <section class="step method-step" aria-labelledby="method-heading">
      <div class="step-heading">
        <span class="step-number" aria-hidden="true">1</span>
        <h3 id="method-heading">変換方法を選ぶ</h3>
      </div>

      <div class="main-category-tabs" role="tablist" aria-label="変換カテゴリ">
        <button
          id="practicalTab"
          class="main-category-tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="practicalPanel"
          data-category="practical"
          disabled
        >実用</button>
        <button
          id="funTab"
          class="main-category-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="funPanel"
          data-category="fun"
          disabled
        >ネタ</button>
      </div>

      <div
        id="practicalPanel"
        class="conversion-panel"
        role="tabpanel"
        aria-labelledby="practicalTab"
      >
        <div
          id="practicalTabsContainer"
          class="conversion-grid"
          role="radiogroup"
          aria-label="実用変換の種類"
        ></div>
      </div>

      <div
        id="funPanel"
        class="conversion-panel"
        role="tabpanel"
        aria-labelledby="funTab"
        hidden
      >
        <p class="fun-notice" role="note">
          実在する文字を使った変換も、翻訳ではなく意味のないランダム文字列です。
        </p>
        <div
          id="funTabsContainer"
          class="conversion-grid"
          role="radiogroup"
          aria-label="ネタ変換の種類"
        ></div>
      </div>

      <p id="selectionSummary" class="selection-summary" aria-live="polite">設定を読み込んでいます。</p>
    </section>

    <section class="step input-step" aria-labelledby="input-heading">
      <div class="step-heading">
        <span class="step-number" aria-hidden="true">2</span>
        <h3 id="input-heading">文章を入力する</h3>
      </div>

      <label for="inputText" class="field-label">変換したい文章</label>
      <textarea
        id="inputText"
        rows="6"
        placeholder="設定を読み込んでいます"
        aria-describedby="inputHelp charCounter"
        disabled
      ></textarea>
      <div class="input-meta">
        <div class="input-actions">
          <button id="clearAllBtn" class="text-action danger-action" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" class="action-icon">
              <path d="M9 3h6m-9 4h12m-1 0-.7 13H7.7L7 7m3 3v7m4-7v7" />
            </svg>
            全消し
          </button>
          <button id="undoClearBtn" class="text-action" type="button" hidden>元に戻す</button>
        </div>
        <span id="charCounter" class="char-counter">0 / 2000文字</span>
      </div>
      <p id="inputHelp" class="input-help">Ctrl＋Enter（Macは⌘＋Enter）でも変換できます。</p>

      <button id="convertBtn" class="primary-action" type="button" disabled>変換する</button>
    </section>

    <section id="resultArea" class="step result-step" aria-labelledby="result-heading" hidden>
      <div class="step-heading">
        <span class="step-number" aria-hidden="true">3</span>
        <h3 id="result-heading">変換結果</h3>
      </div>
      <output id="resultText" class="result-text" for="inputText"></output>
      <button id="copyBtn" class="copy-action" type="button" hidden>
        <span class="copy-icon" aria-hidden="true">📋</span>
        <span class="copy-label">結果をコピー</span>
      </button>
    </section>

    <div id="loadError" class="load-error" role="alert" hidden>
      <p id="loadErrorMessage"></p>
      <button id="retryBtn" class="secondary-action" type="button">もう一度読み込む</button>
    </div>

    <p id="appStatus" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <p>入力した文章は外部へ送信・保存されません。</p>
    <p>© 2025–2026 かたかた</p>
  </footer>
</body>
</html>
